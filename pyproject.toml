[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fabric-deployer"
version = "0.1.0"
description = "Dry-run-first Microsoft Fabric item definition deployment CLI"
requires-python = ">=3.10"
dependencies = [
    "azure-identity>=1.15,<2",
    "requests>=2.31,<3",
]

[project.scripts]
fabric-deployer = "fabric_deployer.cli:main"

[tool.setuptools.packages.find]
include = ["fabric_deployer*"]
